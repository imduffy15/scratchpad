apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.eso.serviceAccountName }}
  namespace: {{ .Values.eso.namespace }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: cloudsmith-token
spec:
  kind: CloudsmithAccessToken
  generator:
    cloudsmithAccessTokenSpec:
      apiUrl: {{ .Values.cloudsmith.apiUrl | quote }}
      orgSlug: {{ include "cr.org" . | quote }}
      serviceSlug: {{ include "cr.serviceSlug" . | quote }}
      serviceAccountRef:
        name: {{ .Values.eso.serviceAccountName | quote }}
        namespace: {{ .Values.eso.namespace | quote }}
        audiences:
          - {{ .Values.cloudsmith.audience | quote }}
---
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: {{ .Values.pullSecret.name }}
spec:
  externalSecretName: {{ .Values.pullSecret.name }}
  namespaceSelector:
    matchLabels:
      {{ .Values.eso.namespaceSelectorLabel }}: {{ .Values.eso.namespaceSelectorValue | quote }}
  refreshTime: {{ .Values.eso.clusterRefreshTime }}
  externalSecretSpec:
    refreshInterval: {{ .Values.eso.refreshInterval }}
    target:
      name: {{ .Values.pullSecret.name }}
      creationPolicy: Owner
      template:
        type: kubernetes.io/dockerconfigjson
        data:
          # {{ "{{ .auth }}" }} is an ESO generator output key — escaped so Helm
          # passes it through literally for ESO to template at runtime.
          .dockerconfigjson: |
            {
              "auths": {
                "{{ .Values.cloudsmith.registryHost }}": {
                  "auth": "{{ "{{ .auth }}" }}"
                }
              }
            }
    dataFrom:
      - sourceRef:
          generatorRef:
            apiVersion: generators.external-secrets.io/v1alpha1
            kind: ClusterGenerator
            name: cloudsmith-token
