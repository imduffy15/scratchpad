# ---------------------------------------------------------------------------
# ClusterExternalSecret: distribute the Cloudsmith image-pull secret into MANY
# namespaces at once.
#
# This is the key to "populate the image pull secret into various different
# namespaces" without per-namespace boilerplate:
#
#   * namespaceSelector  -> every namespace labelled `cloudsmith-pull-secret=enabled`
#                           gets a generated ExternalSecret.
#   * externalSecretSpec -> each ExternalSecret runs the Cloudsmith generator and
#                           writes a `kubernetes.io/dockerconfigjson` Secret named
#                           `cloudsmith-pull-secret`.
#   * refreshTime/refreshInterval -> ESO re-runs the generator before the
#                           short-lived token expires, rotating the secret.
#
# To onboard a new namespace later, just label it:
#   kubectl label namespace <ns> cloudsmith-pull-secret=enabled
# ---------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: cloudsmith-pull-secret
spec:
  # Name of the ExternalSecret to be created in each matching namespace.
  externalSecretName: cloudsmith-pull-secret

  # Which namespaces should receive the pull secret.
  namespaceSelector:
    matchLabels:
      cloudsmith-pull-secret: "enabled"

  # How often to reconcile the set of matching namespaces.
  refreshTime: 1m

  # The ExternalSecret that gets created in every selected namespace.
  externalSecretSpec:
    refreshInterval: 50m # refresh the token before it expires
    target:
      name: cloudsmith-pull-secret
      creationPolicy: Owner
      template:
        type: kubernetes.io/dockerconfigjson
        data:
          # The generator exposes `auth` (base64 user:token). We build a
          # dockerconfigjson pointing at the Cloudsmith Docker registry host.
          .dockerconfigjson: |
            {
              "auths": {
                "docker.cloudsmith.io": {
                  "auth": "{{ .auth }}"
                }
              }
            }
    dataFrom:
      - sourceRef:
          generatorRef:
            apiVersion: generators.external-secrets.io/v1alpha1
            kind: ClusterGenerator
            name: cloudsmith-token
