# ---------------------------------------------------------------------------
# Cloudsmith access-token generator.
#
# We wrap the CloudsmithAccessToken generator in a cluster-scoped
# `ClusterGenerator` so that a single `ClusterExternalSecret` (which creates
# ExternalSecrets across many namespaces) can reference it from anywhere.
#
# The generator exchanges the `cloudsmith-token-sa` ServiceAccount JWT for a
# short-lived Cloudsmith token over OIDC and exposes an `auth` output key
# (base64-encoded credentials) suitable for a dockerconfigjson secret.
#
# Spec fields (from the CloudsmithAccessTokenSpec CRD):
#   apiUrl            optional, defaults to https://api.cloudsmith.io
#   orgSlug           required, your Cloudsmith organisation slug
#   serviceSlug       required, the Cloudsmith OIDC service slug
#   serviceAccountRef required, the SA to federate (name/namespace/audiences)
# ---------------------------------------------------------------------------
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: cloudsmith-token
spec:
  kind: CloudsmithAccessToken
  generator:
    cloudsmithAccessTokenSpec:
      apiUrl: "https://api.cloudsmith.io" # optional; this is the default
      orgSlug: "my-org"                   # <-- your Cloudsmith org slug
      serviceSlug: "my-oidc-service"      # <-- your Cloudsmith OIDC service slug
      serviceAccountRef:
        name: "cloudsmith-token-sa"
        namespace: "external-secrets"
        audiences:
          - "https://api.cloudsmith.io"
---
# ---------------------------------------------------------------------------
# Namespaced alternative: if you prefer NOT to use a ClusterGenerator, you can
# instead create a namespaced `CloudsmithAccessToken` in each namespace and
# reference it from a plain ExternalSecret (see 03-single-namespace-example.yaml).
# It is shown here for reference but commented out.
# ---------------------------------------------------------------------------
