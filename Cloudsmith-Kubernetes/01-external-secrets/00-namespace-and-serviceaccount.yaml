# ---------------------------------------------------------------------------
# Namespace for the External Secrets Operator and the ServiceAccount that is
# federated with Cloudsmith via OIDC.
#
# The Cloudsmith OIDC service must trust this ServiceAccount's token. Configure
# the Cloudsmith OIDC service "subject" claim to:
#
#     system:serviceaccount:external-secrets:cloudsmith-token-sa
#
# and the audience to "https://api.cloudsmith.io".
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudsmith-token-sa
  namespace: external-secrets
  # No annotations are required for the Cloudsmith generator itself — ESO mints a
  # bound ServiceAccount token (TokenRequest API) for this SA and exchanges it
  # with Cloudsmith. The cluster's OIDC issuer must be reachable by Cloudsmith.
