# ---------------------------------------------------------------------------
# Kyverno mutating policy: rewrite every Pod image to pull from Cloudsmith.
#
# Adapted from the official Kyverno "Replace Image Registry" sample:
#   https://kyverno.io/policies/other/replace-image-registry/replace-image-registry/
#
# The regex captures an optional leading registry host (group 1) and the rest of
# the reference (group 2: repo/image:tag), then prefixes group 2 with the
# Cloudsmith Docker registry + your org/repo path. Examples:
#
#   nginx:1.25                       -> docker.cloudsmith.io/my-org/my-repo/nginx:1.25
#   docker.io/library/redis:7        -> docker.cloudsmith.io/my-org/my-repo/library/redis:7
#   ghcr.io/acme/api:v2              -> docker.cloudsmith.io/my-org/my-repo/acme/api:v2
#
# A `foreach` precondition skips images that ALREADY point at Cloudsmith so the
# rewrite is idempotent (no double-prefixing on Pod updates).
# ---------------------------------------------------------------------------
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: replace-image-registry
  annotations:
    policies.kyverno.io/title: Replace Image Registry with Cloudsmith
    policies.kyverno.io/category: Image Registry
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/description: >-
      Rewrites the registry of every container, initContainer and
      ephemeralContainer image to docker.cloudsmith.io/my-org/my-repo so that
      all image pulls are served by Cloudsmith, without editing workload
      manifests.
spec:
  background: false
  rules:
    # --- regular containers --------------------------------------------------
    - name: replace-registry-containers
      match:
        any:
          - resources:
              kinds: ["Pod"]
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - external-secrets
                - kyverno
      mutate:
        foreach:
          - list: "request.object.spec.containers"
            preconditions:
              all:
                # skip images already on Cloudsmith (idempotency guard)
                - key: "{{ regex_match('^docker\\.cloudsmith\\.io/.*', '{{element.image}}') }}"
                  operator: Equals
                  value: false
            patchStrategicMerge:
              spec:
                containers:
                  - name: "{{ element.name }}"
                    image: "{{ regex_replace_all('^(localhost/|(?:[a-z0-9]+\\.)+[a-z0-9]+(?::[0-9]+)?/)?(.*)$', '{{element.image}}', 'docker.cloudsmith.io/my-org/my-repo/$2' )}}"

    # --- init containers -----------------------------------------------------
    - name: replace-registry-initcontainers
      match:
        any:
          - resources:
              kinds: ["Pod"]
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - external-secrets
                - kyverno
      preconditions:
        all:
          - key: "{{ request.object.spec.initContainers[] || `[]` | length(@) }}"
            operator: GreaterThanOrEquals
            value: 1
      mutate:
        foreach:
          - list: "request.object.spec.initContainers"
            preconditions:
              all:
                - key: "{{ regex_match('^docker\\.cloudsmith\\.io/.*', '{{element.image}}') }}"
                  operator: Equals
                  value: false
            patchStrategicMerge:
              spec:
                initContainers:
                  - name: "{{ element.name }}"
                    image: "{{ regex_replace_all('^(localhost/|(?:[a-z0-9]+\\.)+[a-z0-9]+(?::[0-9]+)?/)?(.*)$', '{{element.image}}', 'docker.cloudsmith.io/my-org/my-repo/$2' )}}"

    # --- ephemeral containers (kubectl debug, etc.) --------------------------
    - name: replace-registry-ephemeralcontainers
      match:
        any:
          - resources:
              kinds: ["Pod"]
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - external-secrets
                - kyverno
      preconditions:
        all:
          - key: "{{ request.object.spec.ephemeralContainers[] || `[]` | length(@) }}"
            operator: GreaterThanOrEquals
            value: 1
      mutate:
        foreach:
          - list: "request.object.spec.ephemeralContainers"
            preconditions:
              all:
                - key: "{{ regex_match('^docker\\.cloudsmith\\.io/.*', '{{element.image}}') }}"
                  operator: Equals
                  value: false
            patchStrategicMerge:
              spec:
                ephemeralContainers:
                  - name: "{{ element.name }}"
                    image: "{{ regex_replace_all('^(localhost/|(?:[a-z0-9]+\\.)+[a-z0-9]+(?::[0-9]+)?/)?(.*)$', '{{element.image}}', 'docker.cloudsmith.io/my-org/my-repo/$2' )}}"
