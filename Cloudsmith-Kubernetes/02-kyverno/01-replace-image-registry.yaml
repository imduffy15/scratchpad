# ---------------------------------------------------------------------------
# Kyverno mutating policy: rewrite every Pod image to pull from Cloudsmith.
#
# Adapted from the official Kyverno "Replace Image Registry" sample:
#   https://kyverno.io/policies/other/replace-image-registry/replace-image-registry/
#
# Parameterised via the `cloudsmith-config` ConfigMap (00-cloudsmith-config.yaml)
# loaded with a `context` — no hardcoded org/repo here. The regex captures an
# optional leading registry host (group 1) and the rest of the reference
# (group 2: repo/image:tag), then prefixes group 2 with cfg.data.registryPrefix.
# Examples (with prefix docker.cloudsmith.io/iduffy-demo/default/):
#
#   ubuntu:latest        -> docker.cloudsmith.io/iduffy-demo/default/ubuntu:latest
#   ghcr.io/acme/api:v2  -> docker.cloudsmith.io/iduffy-demo/default/acme/api:v2
#
# A `foreach` precondition skips images already on the Cloudsmith host so the
# rewrite is idempotent (no double-prefixing on Pod updates).
#
# NOTE: 03-combined-policy.yaml combines this with the pull-secret injection and
# is the recommended single resource to apply.
# ---------------------------------------------------------------------------
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: replace-image-registry
  annotations:
    policies.kyverno.io/title: Replace Image Registry with Cloudsmith
    policies.kyverno.io/category: Image Registry
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/description: >-
      Rewrites the registry of every container, initContainer and
      ephemeralContainer image to the Cloudsmith prefix from the
      cloudsmith-config ConfigMap, without editing workload manifests.
spec:
  background: false
  rules:
    # --- regular containers --------------------------------------------------
    - name: replace-registry-containers
      match:
        any:
          - resources:
              kinds: ["Pod"]
      exclude: &exclude-system
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - external-secrets
                - kyverno
      context: &cfg
        - name: cfg
          configMap:
            name: cloudsmith-config
            namespace: kyverno
      mutate:
        foreach:
          - list: "request.object.spec.containers"
            preconditions:
              all:
                - key: "{{ contains('{{element.image}}', '{{cfg.data.registryHost}}') }}"
                  operator: Equals
                  value: false
            patchStrategicMerge:
              spec:
                containers:
                  - name: "{{ element.name }}"
                    image: "{{ regex_replace_all('^(localhost/|(?:[a-z0-9]+\\.)+[a-z0-9]+(?::[0-9]+)?/)?(.*)$', '{{element.image}}', '{{cfg.data.registryPrefix}}$2' )}}"

    # --- init containers -----------------------------------------------------
    - name: replace-registry-initcontainers
      match:
        any:
          - resources:
              kinds: ["Pod"]
      exclude: *exclude-system
      context: *cfg
      preconditions:
        all:
          - key: "{{ request.object.spec.initContainers[] || `[]` | length(@) }}"
            operator: GreaterThanOrEquals
            value: 1
      mutate:
        foreach:
          - list: "request.object.spec.initContainers"
            preconditions:
              all:
                - key: "{{ contains('{{element.image}}', '{{cfg.data.registryHost}}') }}"
                  operator: Equals
                  value: false
            patchStrategicMerge:
              spec:
                initContainers:
                  - name: "{{ element.name }}"
                    image: "{{ regex_replace_all('^(localhost/|(?:[a-z0-9]+\\.)+[a-z0-9]+(?::[0-9]+)?/)?(.*)$', '{{element.image}}', '{{cfg.data.registryPrefix}}$2' )}}"

    # --- ephemeral containers (kubectl debug, etc.) --------------------------
    - name: replace-registry-ephemeralcontainers
      match:
        any:
          - resources:
              kinds: ["Pod"]
      exclude: *exclude-system
      context: *cfg
      preconditions:
        all:
          - key: "{{ request.object.spec.ephemeralContainers[] || `[]` | length(@) }}"
            operator: GreaterThanOrEquals
            value: 1
      mutate:
        foreach:
          - list: "request.object.spec.ephemeralContainers"
            preconditions:
              all:
                - key: "{{ contains('{{element.image}}', '{{cfg.data.registryHost}}') }}"
                  operator: Equals
                  value: false
            patchStrategicMerge:
              spec:
                ephemeralContainers:
                  - name: "{{ element.name }}"
                    image: "{{ regex_replace_all('^(localhost/|(?:[a-z0-9]+\\.)+[a-z0-9]+(?::[0-9]+)?/)?(.*)$', '{{element.image}}', '{{cfg.data.registryPrefix}}$2' )}}"
