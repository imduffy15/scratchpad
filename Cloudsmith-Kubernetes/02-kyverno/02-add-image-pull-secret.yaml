# ---------------------------------------------------------------------------
# Kyverno mutating policy: inject the Cloudsmith imagePullSecret into every Pod.
#
# The secret name comes from the `cloudsmith-config` ConfigMap
# (00-cloudsmith-config.yaml) via a `context` lookup — nothing hardcoded.
# `patchStrategicMerge` with a named element is additive: Kyverno appends the
# secret if absent, leaving existing imagePullSecrets intact.
#
# The Secret itself is created in each namespace by the ClusterExternalSecret in
# 01-external-secrets/02-clusterexternalsecret-pullsecret.yaml.
# ---------------------------------------------------------------------------
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-cloudsmith-pull-secret
  annotations:
    policies.kyverno.io/title: Add Cloudsmith imagePullSecret
    policies.kyverno.io/category: Image Registry
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/description: >-
      Appends the Cloudsmith imagePullSecret (named in cloudsmith-config) to
      every Pod so the kubelet can authenticate to the Cloudsmith registry.
spec:
  background: false
  rules:
    - name: add-cloudsmith-pull-secret
      match:
        any:
          - resources:
              kinds: ["Pod"]
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - external-secrets
                - kyverno
      context:
        - name: cfg
          configMap:
            name: cloudsmith-config
            namespace: kyverno
      mutate:
        patchStrategicMerge:
          spec:
            imagePullSecrets:
              - name: "{{ cfg.data.pullSecretName }}"
