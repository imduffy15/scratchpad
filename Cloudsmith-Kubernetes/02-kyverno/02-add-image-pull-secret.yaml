# ---------------------------------------------------------------------------
# Kyverno mutating policy: inject the Cloudsmith imagePullSecret into every Pod.
#
# `patchStrategicMerge` with a named element under imagePullSecrets is additive:
# Kyverno appends `cloudsmith-pull-secret` if it is not already present, leaving
# any existing imagePullSecrets intact.
#
# The Secret itself is created in each namespace by the ClusterExternalSecret in
# 01-external-secrets/02-clusterexternalsecret-pullsecret.yaml.
# ---------------------------------------------------------------------------
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-cloudsmith-pull-secret
  annotations:
    policies.kyverno.io/title: Add Cloudsmith imagePullSecret
    policies.kyverno.io/category: Image Registry
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/description: >-
      Appends the cloudsmith-pull-secret imagePullSecret to every Pod so the
      kubelet can authenticate to the Cloudsmith Docker registry.
spec:
  background: false
  rules:
    - name: add-cloudsmith-pull-secret
      match:
        any:
          - resources:
              kinds: ["Pod"]
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - external-secrets
                - kyverno
      mutate:
        patchStrategicMerge:
          spec:
            imagePullSecrets:
              - name: cloudsmith-pull-secret
