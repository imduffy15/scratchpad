# ---------------------------------------------------------------------------
# The single ClusterPolicy: rewrite every image to Cloudsmith AND inject the
# imagePullSecret.
#
# Fully PARAMETERISED — org/repo/registry/secret-name come from the
# `cloudsmith-config` ConfigMap (created by the Helm chart from Terraform
# outputs), loaded per-rule via a `context`. Nothing here is hardcoded.
#
# Applied by `mise run policy`; the ConfigMap it reads is created by the chart
# (`mise run helmfile`).
# ---------------------------------------------------------------------------
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cloudsmith-registry
  annotations:
    policies.kyverno.io/title: Route all images through Cloudsmith
    policies.kyverno.io/category: Image Registry
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/description: >-
      Cluster-wide: rewrites every container image to the Cloudsmith registry
      prefix from the cloudsmith-config ConfigMap and injects the pull secret,
      so all image pulls go through Cloudsmith without editing manifests.
spec:
  background: false
  rules:
    # 1) rewrite registry for containers ------------------------------------
    - name: replace-registry-containers
      match:
        any:
          - resources:
              kinds: ["Pod"]
      exclude: &exclude-system
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - external-secrets
                - kyverno
      context: &cfg
        - name: cfg
          configMap:
            name: cloudsmith-config
            namespace: kyverno
      mutate:
        foreach:
          - list: "request.object.spec.containers"
            preconditions:
              all:
                # skip images already on the Cloudsmith host (idempotency guard)
                - key: "{{ contains('{{element.image}}', '{{cfg.data.registryHost}}') }}"
                  operator: Equals
                  value: false
            patchStrategicMerge:
              spec:
                containers:
                  - name: "{{ element.name }}"
                    image: "{{ regex_replace_all('^(localhost/|(?:[a-z0-9]+\\.)+[a-z0-9]+(?::[0-9]+)?/)?(.*)$', '{{element.image}}', '{{cfg.data.registryPrefix}}$2' )}}"

    # 2) rewrite registry for initContainers --------------------------------
    - name: replace-registry-initcontainers
      match:
        any:
          - resources:
              kinds: ["Pod"]
      exclude: *exclude-system
      context: *cfg
      preconditions:
        all:
          - key: "{{ request.object.spec.initContainers[] || `[]` | length(@) }}"
            operator: GreaterThanOrEquals
            value: 1
      mutate:
        foreach:
          - list: "request.object.spec.initContainers"
            preconditions:
              all:
                - key: "{{ contains('{{element.image}}', '{{cfg.data.registryHost}}') }}"
                  operator: Equals
                  value: false
            patchStrategicMerge:
              spec:
                initContainers:
                  - name: "{{ element.name }}"
                    image: "{{ regex_replace_all('^(localhost/|(?:[a-z0-9]+\\.)+[a-z0-9]+(?::[0-9]+)?/)?(.*)$', '{{element.image}}', '{{cfg.data.registryPrefix}}$2' )}}"

    # 3) rewrite registry for ephemeralContainers ---------------------------
    - name: replace-registry-ephemeralcontainers
      match:
        any:
          - resources:
              kinds: ["Pod"]
      exclude: *exclude-system
      context: *cfg
      preconditions:
        all:
          - key: "{{ request.object.spec.ephemeralContainers[] || `[]` | length(@) }}"
            operator: GreaterThanOrEquals
            value: 1
      mutate:
        foreach:
          - list: "request.object.spec.ephemeralContainers"
            preconditions:
              all:
                - key: "{{ contains('{{element.image}}', '{{cfg.data.registryHost}}') }}"
                  operator: Equals
                  value: false
            patchStrategicMerge:
              spec:
                ephemeralContainers:
                  - name: "{{ element.name }}"
                    image: "{{ regex_replace_all('^(localhost/|(?:[a-z0-9]+\\.)+[a-z0-9]+(?::[0-9]+)?/)?(.*)$', '{{element.image}}', '{{cfg.data.registryPrefix}}$2' )}}"

    # 4) inject the Cloudsmith imagePullSecret ------------------------------
    - name: add-cloudsmith-pull-secret
      match:
        any:
          - resources:
              kinds: ["Pod"]
      exclude: *exclude-system
      context: *cfg
      mutate:
        patchStrategicMerge:
          spec:
            imagePullSecrets:
              - name: "{{ cfg.data.pullSecretName }}"
