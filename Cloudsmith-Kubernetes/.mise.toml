# mise manages all runtimes and tooling so everyone uses the same versions.
# Install mise (https://mise.jdx.dev), then:
#
#   mise install        # install the tools below
#   mise run bootstrap  # the whole thing: terraform -> values -> helmfile -> policy -> demo -> verify
#
# Individual steps are tasks: tf-apply, tf-values, helmfile, policy, demo, verify,
# render, demo-rbac, verify-rbac. Run `mise tasks` to list them.

[tools]
terraform = "1.9.8"        # or: opentofu = "1.8"
helm = "3.16.3"
helmfile = "0.169.1"
kubectl = "1.31.3"
kyverno = "1.13.2"         # CLI (aqua backend), for `mise run render`-style local checks
jq = "1.7.1"

[env]
# CLOUDSMITH_ORG is used by scale/generate-namespaces.sh. The deploy values
# (org/repo/serviceSlug) come from Terraform, not from here.
CLOUDSMITH_ORG = "iduffy-demo"
# CLOUDSMITH_API_KEY is read by the Cloudsmith Terraform provider. Export it in
# your shell or a git-ignored mise.local.toml: CLOUDSMITH_API_KEY = "..."

[tasks.tf-init]
description = "Initialise Terraform (Cloudsmith provider)"
dir = "terraform"
run = "terraform init"

[tasks.tf-apply]
description = "Create the Cloudsmith repo, upstreams, services + OIDC via Terraform"
dir = "terraform"
depends = ["tf-init"]
run = "terraform apply"

[tasks.tf-values]
description = "Render Terraform outputs into Helm values (chart-values.generated.yaml)"
run = "./scripts/tf-to-values.sh"

[tasks.helmfile]
description = "Install ESO + Kyverno + the cloudsmith-registry chart (values from Terraform)"
depends = ["tf-values"]
run = """
helm plugin install https://github.com/databus23/helm-diff 2>/dev/null || true
helmfile sync
"""

[tasks.policy]
description = "Apply the generic Kyverno ClusterPolicy (reads the chart's ConfigMap)"
run = "kubectl apply -f kyverno/policy.yaml"

[tasks.demo]
description = "Apply the basic demo namespaces + multi-registry workloads"
run = "kubectl apply -f demo/00-demo-namespaces.yaml -f demo/01-sample-deployment.yaml"

[tasks.verify]
description = "Verify the pull secret + Kyverno mutation worked"
run = "./scripts/verify.sh"

[tasks.render]
description = "Render the chart locally to inspect the generated manifests"
run = "helm template cloudsmith-registry ./chart -f chart-values.generated.yaml"

[tasks.demo-rbac]
description = "Apply the multi-repo RBAC demo (team-a/team-b, per-namespace identity)"
run = "kubectl apply -f demo-rbac/00-team-identities.yaml -f demo-rbac/01-team-b-workloads.yaml -f demo-rbac/02-team-a-workloads.yaml"

[tasks.verify-rbac]
description = "Show which team pods pull and which get 403 (RBAC proof)"
run = "./scripts/verify-rbac.sh"

[tasks.bootstrap]
description = "Everything: terraform -> values -> helmfile -> policy -> demo -> verify"
run = """
mise run tf-apply
mise run tf-values
mise run helmfile
mise run policy
mise run demo
mise run verify
"""
