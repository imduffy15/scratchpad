# ---------------------------------------------------------------------------
# Demo namespaces for the BASIC (shared-identity) transparent-rewrite demo.
# The `cloudsmith-pull-secret: enabled` label is what causes the shared
# ClusterExternalSecret to create the dockerconfigjson pull secret here.
#
# (The multi-repo RBAC demo uses its OWN namespaces team-a/team-b with
# per-namespace identity — see ../04-multi-repo-rbac/.)
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: demo-a
  labels:
    cloudsmith-pull-secret: "enabled"
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-b
  labels:
    cloudsmith-pull-secret: "enabled"
